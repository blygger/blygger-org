<!doctype html>
<!-- Source for wordmark-square.png: the blygger.org header wordmark (site.css
     .wordmark, .wordmark .dot) set large on a square. Re-render with
     marketing/render.mjs; do not edit the PNG by hand. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body {
    width: 2048px; height: 2048px;
    display: flex; align-items: center; justify-content: center;
    background: #f6f4ee;
    font-family: ui-monospace, "SF Mono", "IBM Plex Mono", "JetBrains Mono", Menlo, monospace;
    -webkit-font-smoothing: antialiased;
  }
  .wordmark {
    color: #1b1d22; font-weight: 600; font-size: 300px; letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 0.5em;
  }
  .dot { width: 0.55em; height: 0.55em; border-radius: 50%; background: #d95a1f; display: inline-block; }
</style></head>
<body><span class="wordmark"><span class="dot"></span>blygger</span></body></html>
