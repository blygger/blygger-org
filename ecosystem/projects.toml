# The curated ecosystem list. HAND-EDITED — this is the source of truth for
# what appears at blygger.org/ecosystem/.
#
# Listing is an editorial act, exactly as it is at blygger.com: sync_ecosystem.py
# enriches and checks these entries, and reports repos it discovered that are not
# here, but it never adds one by itself.
#
# Fields
#   repo      "owner/name" on GitHub. Optional — several clients have no located
#             repo and are listed from their manifest alone.
#   url       Homepage, if there is no repo or the homepage is the better link.
#   category  client | tool | integration | mod | reader | library
#               client       publishes a blyg of its own; has a `generator`
#               tool         authors into an existing blyg
#               integration  teaches an existing publishing system to emit a blyg
#               mod          a modified copy of blygger-studio
#   name      Human name. Defaults to the repo's last path segment, else the
#             generator with its version stripped.
#   generator The exact `generator` string it writes into blyg.json, if it publishes.
#             This is the join key against the live census.
#   generator_aliases
#             Historical generator strings. REQUIRED after any rename or version
#             bump, or the project's own live nodes read as an unidentified client.
#   live      A blyg it produced, if one is public.
#   summary   A curator's note. NOT rendered since 2026-10-06, when the page became a
#             bare index (name, link, author, live blygs) at Venkat's request.
#   ours      true for the three artifacts we maintain.
#   submitted Who told us, and when. "census" means we found it in a manifest.
#   retired   true for a client no live blyg runs any more; rendered as "retired".
#
# The census join matches exact generator strings and aliases first, then any
# generator with the same client name (the part before "/"), so a version bump
# no longer needs an alias to stay credited.

# Repos the GitHub search finds that are deliberately NOT listed, so the sync
# stops reporting them. Each needs a reason.
skip = [
  "chrisbodhi/newschematic",  # a site built with hugo-blyg (listed), not a project
]

# ─── Ours ──────────────────────────────────────────────────────────────────────

[[project]]
repo = "blygger/blygger-studio"
name = "Blygger Studio"
category = "client"
# Fallback only. The live value is READ from ../blygger-studio/package.json by
# sync_ecosystem.py, because this literal drifted three releases behind between
# 2026-09-28's 0.4.0 and 0.7.0 — the page spent that time telling five live
# nodes to upgrade to a build older than the one they were already running.
generator = "blygger-studio/0.7.0"
# Pre-rename strings only. Every `blygger-studio/*` version is derived from that
# repo's own git tags, for the same reason: the alias you forget to add is the
# one belonging to the node you most wanted to reach.
generator_aliases = ["blyg-ref/0.3.0", "blyg-ref/0.2.0", "blyg-ref/0.1.0"]
live = "https://venkateshrao.com/blyg/"
ours = true
summary = "The reference client. A Cloudflare Worker that publishes a blyg, subscribes to others, and threads, transcludes and responds across them. Named blyg-ref until 2026-09-28."

# ─── Clients — publish a blyg of their own ─────────────────────────────────────

[[project]]
repo = "BradyDale/Blynger"
name = "Blynger"
category = "client"
generator = "Blynger/0.9.31"
# Every version a live node has been seen reporting. Blynger bumps often, so
# each new release needs its old string added here or it reads as unidentified.
generator_aliases = ["Blynger/0.9.21", "Blynger/0.8.2"]
live = "https://bradydale.com/blyg/"
submitted = "census 2026-09-28; repo from Brady Dale, blygger-org#2 (2026-10-04)"
summary = "Brady Dale's independent client, on its own version line. Publishes protocol 0.3. Its robot badge for generated text is the convention Blygger Studio adopted in 0.27.0."

