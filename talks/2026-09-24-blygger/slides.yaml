# Slide structure — Blygger at the Protocol Symposium 2026
#
# This file is what's PROJECTED. `track.md` carries the speaker's cues — the talk is
# improvised to the slides, not read from a script, so there are no word budgets and
# no spoken-time estimate: both would be measuring the wrong thing.
#
# See brief.md for operator inputs. Slides 01-04 are Venkat's and are stubs.

