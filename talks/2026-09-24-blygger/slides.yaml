  # ── UX ────────────────────────────────────────────────────────────────────
  - id: "05"
    title: "A blyg is fragments and threads"
    section: "How it feels to use"
    image: "images/public-feed.jpg"
    image_alt: >
      The public page of Venkatesh Rao's Blyg, showing a fragment titled Shopping List
      with a version line reading v3, pinned v1 and v3.
    bullets:
      - "Two kinds of thing, not one: a fragment (a note) and a thread (fragments composed into a piece)"
      - "Every item wears its own revision history in public — v3 · pinned: v1, v3"
      - "This is a real page, live at venkateshrao.com/blyg/"
    notes: >
      Opens the UX section on the artifact rather than the architecture. The version
      line is the thing to point at: it is what makes a blyg visibly not a blog, and it
      costs no explanation because it is right there on screen.

  - id: "06"
    title: "Transclusion: quote by reference"
    section: "How it feels to use"
    image: "images/transclusion.jpg"
    image_alt: >
      A thread page showing a quoted fragment in a blockquote with a blue rule, captioned
      "fragment ↗ · snapshot of v2".
    bullets:
      - "Write ![[id]] on its own line — you get the fragment, not a link to it"
      - "Snapshotted at publish: the reader gets the bytes you saw, forever"
      - "Provenance under every quote: which item, which version"
      - "Editing the source later never rewrites the quote"
    notes: >
      The "never rewrites the quote" line is the one that lands with this audience —
      it is the difference between transclusion-as-embed (which breaks) and
      transclusion-as-snapshot (which does not). Real example:
      venkateshrao.com/blyg/t/1vgtgz0g25ztpdsn9hq23x5pxk/

  - id: "07"
    title: "[TK]: leave an instruction in the draft"
    section: "How it feels to use"
    bullets:
      - "[TK]expand this into a paragraph[/TK]  ← an instruction, not yet run"
      - "[TK]expand this[=]…generated prose…[/TK]  ← after you run it"
      - "Inside a TK scope, ![[id]] means source, not quote — material to work from"
      - "Generation is always an explicit act you review. Publishing never generates."
      - "The markers are studio-private. They never reach the wire."
    notes: >
      TK is the copy-desk mark for "to come" — text known to be missing. The two-form
      grammar is the whole mechanism, and the third bullet is the subtle part: the same
      ![[id]] syntax means "quote this verbatim" outside a scope and "feed this to the
      generator" inside one. Worth saying slowly.

  - id: "08"
    title: "Which paragraph was generated?"
    section: "How it feels to use"
    image: "images/tk-published.jpg"
    image_alt: >
      A published thread on the Protocol Institute blyg. Two paragraphs of prose about
      the origins of life, with no visual marking distinguishing generated text.
    bullets:
      - "A real published page. One of these I wrote. One a model wrote."
    notes: >
      Deliberately one bullet and no answer. This slide is a question put to the room,
      and a slide that answers its own question while asking it is not asking it — the
      audience reads the bullets faster than the speaker can set the beat up. Let it
      sit, take a guess or two, then advance.

  - id: "09"
    title: "You can't tell. That is deliberate."
    section: "How it feels to use"
    bullets:
      - "The item JSON says: generated[{sources, model, at}] — two scopes, claude-opus-5"
      - "The HTML carries a blyg-tk-gen class you can inspect. It is deliberately unstyled."
      - "Disclosure is total. It just isn't decorative."
      - "A visible tint would present a self-asserted claim as a verified badge"
    notes: >
      The reveal, and the strongest argument in the deck. Provenance here is
      self-asserted and unverifiable; a colour would start meaning "verified", and a
      badge that looks authoritative and isn't is worse than no badge. Second reason if
      there is room: after author review, the author owns the text.

  - id: "10"
    title: "Writing it"
    section: "How it feels to use"
    image: "images/studio-composer.png"
    image_alt: "The blygger studio composer with a TK scope open."
    bullets:
      - "Studio (private, unconstrained) and page (public, protocol-governed) are different things"
      - "The protocol governs only the page — everything here is this client's choice"
      - "Scope highlighting, a ![[ palette, live preview, Generate/Regenerate"
    notes: >
      NEEDS A SCREENSHOT — images/studio-composer.png does not exist yet; the slide
      renders without an image until it does. The studio/page split is invariant 1 and
      it is worth stating out loud here, because everything the room is looking at on
      this slide is explicitly *not* part of the protocol.

  # ── ELI5 ──────────────────────────────────────────────────────────────────
  - id: "11"
    title: "It's just files"
    section: "How it works"
    bullets:
      - "A blyg is a directory: blyg.json, feed.xml, items/*.json, and a page per item"
      - "No database in the protocol. Copy the directory to any web host and it still works."
      - "It can live at a domain root, a subdirectory, a subdomain — the protocol never assumes"
      - "We test this by exporting the whole thing to flat files and diffing"
    notes: >
      Motivation first, per the brief: the reason "just files" matters to an author is
      that it is the only durable answer to "what happens when the company shuts down".
      The fourth bullet is the honest part — it is a claim we check mechanically rather
      than assert.

  - id: "12"
    title: "It's still RSS"
    section: "How it works"
    bullets:
      - "Every blyg feed is a valid RSS feed. Your existing reader works, today."
      - "Readers that don't know blygger see a normal feed and lose nothing"
      - "A blyg can subscribe to any RSS or Atom feed — no cooperation required"
      - "So your blog is already half in: it can be read, it just can't be quoted"
    notes: >
      This is the slide that makes the medium joinable rather than a walled garden with
      better manners. The last bullet is the useful frame for a publisher audience: the
      asymmetry is exactly what upgrading buys you.

  - id: "13"
    title: "You don't get a username"
    section: "How it works"
    bullets:
      - "No accounts, no handles, no @you@server. There is no namespace to be in."
      - "Your domain is your name. DNS is the namespace — it already exists and already works."
      - "Author names are decoration: optional, per-item, and the protocol promises nothing about them"
      - "The only thing the protocol authenticates is the origin the bytes came from"
      - "So: no follower lists, no follower counts, no follow requests. Following is client-local and invisible."
    notes: >
      The ELI5 section's load-bearing slide and the one most likely to be argued with.
      The motivation to lead with is that every namespace is a registry, every registry
      has an owner, and the owner is the thing you were trying not to have. Identity, like
      AI, is deliberately never in the protocol.

  - id: "14"
    title: "Nothing is deleted. Some things are promised forever."
    section: "How it works"
    bullets:
      - "No hard delete. The single exit is withdraw — a permanent, visible endcap."
      - "A pin is an irrevocable promise to host one exact version, forever"
      - "Pins survive withdrawal. That is the point of a pin."
      - "Unpinned history is unreachable in every representation — no route serves it"
      - "Version numbers are a bare counter. Significance is the pin, not the number."
    notes: >
      An edition bump is cheap talk; a pin is a costly signal. That asymmetry is the
      design argument and it is worth stating in those words. The fourth bullet is what
      keeps withdrawal meaningful — if unpinned history were fetchable anywhere,
      withdrawing would be theatre.

  # ── Technical ─────────────────────────────────────────────────────────────
  - id: "15"
    title: "The wire, for protocol people"
    section: "For implementers"
    bullets:
      - "Two planes: items/{id}.json is state (ground truth, full archive); feed.xml is notification (lossy, just a signal)"
      - "AP under partition. Convergence is poll-driven and eventual — observed ~25 min, worst case ~45."
      - "The archive index is the reconciliation surface; the feed is a cheap trigger. Gaps degrade to an index diff, never to loss."
      - "Version watermarks never silently regress — a lower version is surfaced as a suspected history rewrite, not applied"
      - "IDs are stable random 128-bit. Never content-addressed — identity must survive editing."
      - "Conformance L0–L3, strict supersets. Unknown constructs are ignored, not rejected."
    notes: >
      Jargon deliberately unhedged here per the brief. The design point worth making
      explicitly: choosing the archive index rather than the feed as the reconciliation
      surface is what lets the notification plane be lossy without the state plane being
      lossy, which is what makes plain RSS a sufficient notification layer.

  - id: "16"
    title: "What is deliberately not enshrined"
    section: "For implementers"
    bullets:
      - "AI. Generation is studio-side; the wire gets output plus provenance."
      - "Identity. Opaque, client-asserted, never addressable."
      - "Editorial convenience. No reply primitive, ever — transclusion is the primitive."
      - "Significance markup. No semver, no edition field. Pins carry weight instead."
      - "Four separate decisions, four years apart in design-time, same sentence each time."
    notes: >
      This is the closest the deck gets to a thesis and it belongs with the technical
      audience, who will recognise the discipline. The general principle: anything the
      protocol cannot verify, it declines to represent — because a field that looks
      authoritative and isn't is worse than no field.

  # ── Roadmap ───────────────────────────────────────────────────────────────
  - id: "17"
    title: "Where it is, where it's going"
    section: "Roadmap"
    bullets:
      - "Shipped: publish (v0.1), subscribe + blogroll + curation (v0.2), instructed generation (TK-core)"
      - "Running: two live nodes, real cross-node pub-sub, a legacy-RSS subscription"
      - "Next: v0.3 — threads across clients, Webmention with structural verification"
      - "Then: filter plugins, staleness over the DAG, local RAG, then 1.0 freeze"
      - "Pre-1.0 means no promises — including the wire. Nothing is stable until 1.0."
    notes: >
      The last bullet is not a disclaimer, it is decision #21 — building the reference
      implementation *is* how the protocol gets tested, so the spec changes in response
      to what building finds. Inviting participation without saying so would be a
      misrepresentation, and this audience will respect the stance.

  # ── Participate ───────────────────────────────────────────────────────────
  - id: "18"
    title: "If you write"
    section: "How to participate"
    bullets:
      - "Nothing to install yet, honestly — the self-host template is v1.0 RC work"
      - "What's useful now: tell me where the fragment/thread split feels wrong"
      - "Especially: does writing with [TK] change what you write, or just how fast?"
      - "Read the two live blygs; both are real writing, not fixtures"
    notes: >
      Be straight that there is no product yet. The specific ask is better than a
      general one, and the TK question is the one where author experience actually
      decides a design question that is still open.

  - id: "19"
    title: "If you publish"
    section: "How to participate"
    bullets:
      - "You already have the hard part: a domain nobody can take from you"
      - "Your RSS feed already makes you readable from a blyg — no action needed"
      - "A blyg mounts anywhere: yoursite.com/blyg/, blyg.yoursite.com, or the root"
      - "Ask of you: if you'd never run this, say why — that's the most useful failure report"
    notes: >
      Publisher-facing framing. Mount independence matters here specifically because it
      means adopting the protocol does not mean restructuring a site that already works.

  - id: "20"
    title: "If you build"
    section: "How to participate"
    bullets:
      - "Spec: blygger.org/spec/0.2/ — standalone, complete, no deltas to chase"
      - "Reference client: MIT, Cloudflare Workers, ~420 tests"
      - "Documented CSS contract — which classes are wire-visible and what you owe them"
      - "The open gap: a second reference implementation. Local-first, folder-based, static-host deploy."
      - "That second implementation is the 1.0 gate. It is undesigned. It could be yours."
    notes: >
      The highest-leverage ask in the deck, so it goes last and it is specific: a second
      implementation on a completely different substrate is what turns a spec into a
      protocol, and it is a named gate rather than a nice-to-have.

