      - "Spec: blygger.org/spec/0.2/ · Notes: blygger.org/notes/ · Namespace: blygger.org/ns/0.1"
      - "Code: github.com/blygger — MIT (code), CC-BY-4.0 (docs)"
      - "blygger.com — commercial-adjacent, not yet built"
